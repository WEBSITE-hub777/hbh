<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BitTool - Sign Up</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#07111f,#0b2440,#0b6b72);
overflow:hidden;
}
.bg1,.bg2{position:fixed;border-radius:50%;filter:blur(60px);opacity:.45}
.bg1{width:260px;height:260px;background:#00ffaa;left:-60px;top:-40px}
.bg2{width:320px;height:320px;background:#2196f3;right:-80px;bottom:-80px}
.card{
position:relative;
width:410px;
padding:32px;
border-radius:26px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 20px 60px rgba(0,0,0,.35);
color:#fff;
}
.logo{text-align:center;font-size:38px;font-weight:bold}
.logo span{color:#33ff99}
.sub{text-align:center;color:#d3e7ff;margin:10px 0 24px}
.input{margin-bottom:16px}
label{display:block;margin-bottom:6px;font-size:14px}
input{
width:100%;
padding:14px;
border-radius:12px;
border:2px solid transparent;
background:#14233d;
color:#fff;
outline:none;
transition:.25s;
}
input:focus{border-color:#33ff99}
button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
font-size:16px;
font-weight:bold;
background:linear-gradient(135deg,#22c55e,#00b4d8);
color:#fff;
cursor:pointer;
}
button:hover{transform:scale(1.02)}
#msg{margin-top:16px;text-align:center;font-weight:bold;min-height:24px}
</style>
</head>
<body>
<div class="bg1"></div><div class="bg2"></div>

<div class="card">
<div class="logo">Bit<span>Tool</span></div>
<div class="sub">Create your free account</div>

<div class="input">
<label>First Name</label>
<input id="first" placeholder="Enter First Name">
</div>

<div class="input">
<label>Last Name</label>
<input id="last" placeholder="Enter Last Name">
</div>

<div class="input">
<label>Email Address</label>
<input id="email" type="email" placeholder="Enter Email Address">
</div>

<button id="signupBtn">Sign Up</button>
<div id="msg"></div>
</div>

<script>
const btn=document.getElementById("signupBtn");
const msg=document.getElementById("msg");

btn.addEventListener("click",function(){
 const f=document.getElementById("first");
 const l=document.getElementById("last");
 const e=document.getElementById("email");
 [f,l,e].forEach(x=>x.style.borderColor="transparent");
 msg.style.color="#ff7b7b";
 msg.textContent="";
 if(f.value.trim()===""){
   f.style.borderColor="#ff4d4d";
   msg.textContent="⚠ Please enter your First Name.";
   f.focus(); return;
 }
 if(l.value.trim()===""){
   l.style.borderColor="#ff4d4d";
   msg.textContent="⚠ Please enter your Last Name.";
   l.focus(); return;
 }
 if(e.value.trim()===""){
   e.style.borderColor="#ff4d4d";
   msg.textContent="⚠ Please enter your Email Address.";
   e.focus(); return;
 }
 localStorage.setItem("bittool_first",f.value.trim());
 localStorage.setItem("bittool_last",l.value.trim());
 localStorage.setItem("bittool_email",e.value.trim());
 msg.style.color="#66ff99";
 msg.textContent="✅ Welcome to BitTool! Redirecting...";
 setTimeout(()=>location.href="index.html",1200);
});
</script>
</body>
</html>
