<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BitTool - Premium PDF Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,Arial,sans-serif}
body{min-height:100vh;color:#fff;background:linear-gradient(135deg,#071b34,#0c3f6d,#0e8b6d)}
header{height:76px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.15);position:sticky;top:0;z-index:20}
.logo{font-size:29px;font-weight:800}.logo span{color:#00ff95}
.profile{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#00ff95;color:#061426;font-weight:800;cursor:pointer}
.popup{display:none;position:fixed;right:18px;top:88px;width:285px;padding:22px;background:#fff;color:#222;border-radius:20px;z-index:100;box-shadow:0 20px 50px #0005}
.avatar{width:68px;height:68px;margin:auto;border-radius:50%;background:#00ff95;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.popup h2{text-align:center;margin-top:12px}.popup p{text-align:center;margin-top:7px;word-break:break-word}
.app{width:96%;max-width:1150px;margin:28px auto}
.card{background:#ffffff12;border:1px solid #ffffff20;border-radius:25px;padding:22px;backdrop-filter:blur(18px);box-shadow:0 20px 60px #0002}
h1{text-align:center;font-size:30px;margin-bottom:7px}.sub{text-align:center;opacity:.75;margin-bottom:22px}
.toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
button,.toolBtn{border:0;border-radius:13px;padding:13px 12px;background:linear-gradient(90deg,#00ff95,#00cfff);color:#052033;font-weight:800;cursor:pointer;transition:.2s}
button:hover,.toolBtn:hover{transform:translateY(-2px);box-shadow:0 8px 25px #00ff9540}
.workspace{display:grid;grid-template-columns:230px 1fr;gap:20px}
.pages{background:#0003;border-radius:18px;padding:14px;min-height:420px}
.pages h3{margin-bottom:12px}
.pageList{display:flex;flex-direction:column;gap:12px}
.thumb{position:relative;background:#fff;color:#222;border-radius:10px;padding:8px;cursor:pointer;border:3px solid transparent}
.thumb.active{border-color:#00ff95}
.thumbCanvas{width:100%;display:block;background:#fff;border-radius:5px}
.thumbNo{text-align:center;font-size:12px;font-weight:bold;margin-top:5px}

.editorArea{display:flex;justify-content:center;align-items:flex-start;background:#0003;border-radius:18px;padding:20px;min-height:520px;overflow:auto}
#pageCanvas{background:#fff;box-shadow:0 15px 40px #0005;max-width:100%;height:auto}
.controls{margin-top:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.control{background:#0003;padding:15px;border-radius:15px}
label{display:block;font-weight:700;margin-bottom:8px}
input[type=text],input[type=number],select{width:100%;padding:11px;border:0;border-radius:10px}
input[type=color]{width:100%;height:42px;border:0;border-radius:10px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{text-align:center;min-height:24px;margin-top:15px}
.footer{text-align:center;opacity:.7;margin-top:20px}
@media(max-width:750px){.workspace{grid-template-columns:1fr}.pages{min-height:auto}.pageList{display:grid;grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:1fr}.controls{grid-template-columns:1fr}}
</style>
</head>

<body>
<header>
<div class="logo">Bit<span>Tool</span></div>
<div class="profile" id="profileBtn">N</div>
</header>

<div class="popup" id="profilePopup">
<div class="avatar" id="profileAvatar">N</div>
<h2 id="profileName">Your Name</h2>
<p id="profileEmail">Please Sign Up</p>
</div>

<main class="app">
<div class="card">
<h1>Premium PDF Generator</h1>
<p class="sub">Create, edit and download multi-page PDFs</p>



<input id="imageInput" type="file" accept="image/*" hidden>

<div class="workspace">
<section class="pages">
<h3>Pages</h3>
<div id="pageList" class="pageList"></div>
</section>

<section class="editorArea">
<canvas id="pageCanvas" width="794" height="1123"></canvas>
</section>
</div>

<div class="toolbar">
<button id="addPage">＋ Add Page</button>
<button id="addText">＋ Add Text</button>
<button id="addImage">＋ Add Image</button>
<button id="deletePage">🗑 Delete Page</button>
<button id="downloadPdf">📥 Download PDF</button>
<button id="clearAll">↻ New PDF</button>
</div>

<div class="controls">
<div class="control">
<label>Page Background</label>
<input type="color" id="bgColor" value="#ffffff">
</div>

<div class="control">
<label>Text Color</label>
<input type="color" id="textColor" value="#111111">
</div>

<div class="control">
<label>Text</label>
<input type="text" id="textInput" placeholder="Write text here">
<button id="applyText">Add Text To Page</button>
</div>

<div class="control">
<label>Text Size</label>
<input type="number" id="fontSize" value="28" min="8" max="120">
</div>

<div class="control">
<label>PDF File Name</label>
<input type="text" id="pdfName" value="BitTool_Premium_PDF" placeholder="Enter PDF name">
</div>
</div>

<div id="status" class="status"></div>
<div class="footer">Made with ❤️ BitTool</div>
</div>
</main>

<script>
const {jsPDF}=window.jspdf;

const canvas=document.getElementById("pageCanvas");
const ctx=canvas.getContext("2d");
const pageList=document.getElementById("pageList");
const bgColor=document.getElementById("bgColor");
const textColor=document.getElementById("textColor");
const textInput=document.getElementById("textInput");
const fontSize=document.getElementById("fontSize");
const imageInput=document.getElementById("imageInput");
const status=document.getElementById("status");

let pages=[];
let active=0;

function newPage(){
return{
bg:"#ffffff",
elements:[]
};
}

pages=[newPage()];

function setStatus(msg){
status.textContent=msg;
setTimeout(()=>{if(status.textContent===msg)status.textContent=""},2500);
}

function drawPage(){
const p=pages[active];

ctx.fillStyle=p.bg;
ctx.fillRect(0,0,canvas.width,canvas.height);

for(const el of p.elements){
if(el.type==="text"){
ctx.fillStyle=el.color;
ctx.font=`${el.size}px Arial`;
ctx.fillText(el.text,el.x,el.y);
}

if(el.type==="image"&&el.img){
ctx.drawImage(el.img,el.x,el.y,el.w,el.h);
}
}

bgColor.value=p.bg;
renderThumbs();
}

function renderThumbs(){
pageList.innerHTML="";

pages.forEach((p,i)=>{
const box=document.createElement("div");
box.className="thumb"+(i===active?" active":"");

const t=document.createElement("canvas");
t.className="thumbCanvas";
t.width=220;
t.height=311;

const tc=t.getContext("2d");
tc.fillStyle=p.bg;
tc.fillRect(0,0,t.width,t.height);

const sx=t.width/canvas.width;
const sy=t.height/canvas.height;

for(const el of p.elements){
if(el.type==="text"){
tc.fillStyle=el.color;
tc.font=`${Math.max(5,el.size*sx)}px Arial`;
tc.fillText(el.text,el.x*sx,el.y*sy);
}
if(el.type==="image"&&el.img){
tc.drawImage(el.img,el.x*sx,el.y*sy,el.w*sx,el.h*sy);
}
}

const no=document.createElement("div");
no.className="thumbNo";
no.textContent="Page "+(i+1);

box.append(t,no);

box.onclick=()=>{
active=i;
drawPage();
};

pageList.appendChild(box);
});
}

function movePage(index,direction){
const target=index+direction;
if(target<0||target>=pages.length)return;

[pages[index],pages[target]]=[pages[target],pages[index]];
active=target;
drawPage();
setStatus("Page order changed");
}

document.getElementById("addPage").onclick=()=>{
pages.push(newPage());
active=pages.length-1;
drawPage();
setStatus("New page added");
};

document.getElementById("deletePage").onclick=()=>{
if(pages.length===1){
setStatus("At least one page is required");
return;
}
pages.splice(active,1);
active=Math.max(0,active-1);
drawPage();
setStatus("Page deleted");
};

document.getElementById("clearAll").onclick=()=>{
if(!confirm("Start a new PDF?"))return;
pages=[newPage()];
active=0;
drawPage();
setStatus("New PDF created");
};

bgColor.oninput=()=>{
pages[active].bg=bgColor.value;
drawPage();
};

document.getElementById("addText").onclick=()=>{
const text=textInput.value.trim();
if(!text){
setStatus("Enter some text first");
textInput.focus();
return;
}

pages[active].elements.push({
type:"text",
text:text,
x:60,
y:100,
size:Number(fontSize.value)||28,
color:textColor.value
});

textInput.value="";
drawPage();
setStatus("Text added");
};

document.getElementById("applyText").onclick=
document.getElementById("addText").onclick;

document.getElementById("addImage").onclick=()=>{
imageInput.click();
};

imageInput.onchange=()=>{
const file=imageInput.files[0];
if(!file)return;

const reader=new FileReader();

reader.onload=e=>{
const img=new Image();

img.onload=()=>{
let w=400;
let h=img.height*(w/img.width);

if(h>500){
h=500;
w=img.width*(h/img.height);
}

pages[active].elements.push({
type:"image",
img:img,
x:(canvas.width-w)/2,
y:150,
w:w,
h:h
});

drawPage();
setStatus("Image added");
};

img.src=e.target.result;
};

reader.readAsDataURL(file);
imageInput.value="";
};

function makePdf(){
const pdf=new jsPDF({
orientation:"portrait",
unit:"pt",
format:"a4"
});

pages.forEach((p,index)=>{
if(index>0)pdf.addPage();

const pageW=pdf.internal.pageSize.getWidth();
const pageH=pdf.internal.pageSize.getHeight();

pdf.setFillColor(
parseInt(p.bg.slice(1,3),16),
parseInt(p.bg.slice(3,5),16),
parseInt(p.bg.slice(5,7),16)
);

pdf.rect(0,0,pageW,pageH,"F");

const sx=pageW/canvas.width;
const sy=pageH/canvas.height;

for(const el of p.elements){
if(el.type==="text"){
pdf.setTextColor(
parseInt(el.color.slice(1,3),16),
parseInt(el.color.slice(3,5),16),
parseInt(el.color.slice(5,7),16)
);
pdf.setFont("helvetica","normal");
pdf.setFontSize(el.size*sx);
pdf.text(el.text,el.x*sx,el.y*sy);
}

if(el.type==="image"&&el.img){
let format="JPEG";
const src=el.img.src||"";
if(src.startsWith("data:image/png"))format="PNG";
if(src.startsWith("data:image/webp"))format="WEBP";

try{
pdf.addImage(
el.img,
format,
el.x*sx,
el.y*sy,
el.w*sx,
el.h*sy
);
}catch(e){
try{
pdf.addImage(
el.img,
"JPEG",
el.x*sx,
el.y*sy,
el.w*sx,
el.h*sy
);
}catch(err){}
}
}
}

});

return pdf;
}

document.getElementById("downloadPdf").onclick=()=>{
try{
setStatus("Creating PDF...");
const pdf=makePdf();
let pdfName=document.getElementById("pdfName").value.trim();

if(!pdfName){
  pdfName="BitTool_Premium_PDF";
}

pdfName=pdfName.replace(/\\/g,"").replace(/[\\/:*?"<>|]/g,"_");

if(!pdfName.toLowerCase().endsWith(".pdf")){
  pdfName+=".pdf";
}

pdf.save(pdfName);
setStatus("PDF downloaded successfully");
}catch(e){
console.error(e);
setStatus("Could not create PDF");
}
};

/* SignUp.html profile integration */
/* SignUp.html integration:
   Uses the exact same localStorage keys:
   bittool_first, bittool_last, bittool_email */
function loadProfile(){
const first=(localStorage.getItem("bittool_first")||"").trim();
const last=(localStorage.getItem("bittool_last")||"").trim();
const email=(localStorage.getItem("bittool_email")||"").trim();

const hasSignup=!!(first||last||email);
const initial=hasSignup
?(first.charAt(0)||last.charAt(0)||"N").toUpperCase()
:"N";

document.getElementById("profileBtn").textContent=initial;
document.getElementById("profileAvatar").textContent=initial;
document.getElementById("profileName").textContent=
hasSignup?((first+" "+last).trim()||"Your Name"):"Your Name";
document.getElementById("profileEmail").textContent=
hasSignup?(email||"No email"):"Please Sign Up";
}
loadProfile();
window.addEventListener("storage",loadProfile);

window.addEventListener("storage",loadProfile);

document.getElementById("profileBtn").onclick=()=>{
const p=document.getElementById("profilePopup");
p.style.display=p.style.display==="block"?"none":"block";
};

drawPage();
</script>
</body>
</html>
