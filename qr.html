<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BitTool Premium QR Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}


body{

min-height:100vh;

background:linear-gradient(135deg,#061426,#0b4168,#008f70);

color:white;

}


header{

display:flex;

justify-content:space-between;

align-items:center;

padding:18px 30px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

}


.logo{

font-size:32px;

font-weight:700;

}


.logo span{

color:#00ff95;

}


.profile{

height:50px;

width:50px;

border-radius:50%;

background:#00ff95;

color:black;

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

font-weight:bold;

cursor:pointer;

}


.card{

width:94%;

max-width:750px;

margin:35px auto;

padding:30px;

border-radius:25px;

background:rgba(255,255,255,.1);

backdrop-filter:blur(20px);

box-shadow:0 0 30px rgba(0,255,150,.2);

}


h1{

text-align:center;

margin-bottom:25px;

}


label{

display:block;

margin-top:18px;

font-weight:600;

}


input[type="text"]{

width:100%;

padding:15px;

border-radius:15px;

border:none;

outline:none;

font-size:16px;

margin-top:8px;

}


input[type="color"]{

width:100%;

height:50px;

border:none;

border-radius:15px;

margin-top:8px;

cursor:pointer;

}


select{

width:100%;

padding:14px;

border:none;

border-radius:15px;

margin-top:8px;

}


button{

width:100%;

padding:16px;

margin-top:20px;

border:none;

border-radius:15px;

background:linear-gradient(90deg,#00ff95,#00cfff);

font-size:17px;

font-weight:bold;

cursor:pointer;

}


button:hover{

transform:translateY(-2px);

}


#qr{

margin-top:30px;

display:flex;

justify-content:center;

background:white;

padding:20px;

border-radius:20px;

}


.footer{

text-align:center;

margin-top:25px;

opacity:.8;

}

</style>

</head>


<body>


<header>

<div class="logo">
Bit<span>Tool</span>
</div>


<div class="profile">
N
</div>


</header>



<div class="card">


<h1>
Premium QR Generator
</h1>



<label>
Enter Link
</label>


<input 
type="text"
id="url"
placeholder="https://example.com"
>



<label>
QR Color
</label>


<input 
type="color"
id="qrColor"
value="#000000"
>



<label>
Background Color
</label>


<input 
type="color"
id="bgColor"
value="#ffffff"
>



<label>
QR Style
</label>


<select id="style">

<option value="square">
Square
</option>

<option value="rounded">
Rounded
</option>

<option value="dots">
Dots
</option>

</select>



<button onclick="generateQR()">

Generate QR

</button>


<div id="qr"></div>


<button onclick="downloadQR()">

Download PNG

</button>



<div class="footer">

Made with ❤️ BitTool

</div>


</div>
